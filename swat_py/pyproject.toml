[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swat_py"
version = "0.1.0"
description = "Python interface for SWAT and SWAT-Plus hydrological models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "IWMI-KR"}
]
keywords = ["SWAT", "SWAT-Plus", "hydrology", "climate change", "streamflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.4",
    "ruff>=0.1",
]

[project.scripts]
# 가뭄예측 (drought)
swat-drought-run               = "swat_py.drought.run:main"
swat-drought-climatology       = "swat_py.drought.climatology_run:main"
swat-drought-ensemble-weather  = "swat_py.drought.ensemble_weather:main"
swat-drought-dashboard         = "swat_py.drought.dashboard_data:main"
swat-drought-figure            = "swat_py.drought.figure:main"
swat-drought-reclassify        = "swat_py.drought.reclassify:main"
swat-drought-historical-worst  = "swat_py.drought.historical_worst:main"
# 검보정 · 모델 관리
swat-calibration-finalize      = "swat_py.calibration.finalize:main"
swat-promote                   = "swat_py.runner.promote:main"
swat-exe-fetch                 = "swat_py.runner.fetch_exe:main"
# Tank 모형
swat-tank-calibrate            = "swat_py.tank.calibrate:main"
swat-tank-reservoir-calibrate  = "swat_py.tank.reservoir_calibrate:main"
swat-tank-compare              = "swat_py.tank.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swat_py = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
