# ══════════════════════════════════════════════════════════════════════════════
#  swat_py 설정 파일 — SWAT/SWAT-Plus 자동화 패키지 (IWMI-KR)
#
#  파일 위치 (자동 탐색 우선순위)
#    1. ACIDWG_PY_CONFIG / SWAT_PY_CONFIG 환경변수
#    2. 호출 시 명시한 yaml 경로
#    3. cwd → 상위 ``swat_py.yaml``
#    4. $PICASO_ROOT/config/swat_py.yaml   ★ 권장
#    5. $PICASO_ROOT/swat_py.yaml
#
#  ★ 표시 항목은 실제 값으로 수정 필요
# ══════════════════════════════════════════════════════════════════════════════


# ── 1. 프로젝트 디렉토리 ─────────────────────────────────────────────────────
project:
  root:     "${env:PICASO_ROOT:C:/Projects/MyWatershed}"   # ★ 프로젝트 루트
  database: "$(project.root)/Database"
  input:
    observed:          "$(project.database)/obs"               # ★ 관측 자료 루트
    observed_weather:  "$(project.database)/obs/weather/daily_std"
    cc_weather:        "$(project.database)/ClimateChange"
    forecast_weather:  "$(project.database)/Forecast"
  # output 경로는 model.type 으로 자동 산출 (3_swatplus/ 또는 3_swat2012/ 아래
  # default/, calibrated/, calibration/, forecast/, cchange/)


# ── 2. 모델 ──────────────────────────────────────────────────────────────────
model:
  type:        "swat_plus"        # ★ swat_plus | swat2012
  executable:  "SWAT-Plus.exe"    # ★ TxtInOut 안 실행파일 이름


# ── 3. 시뮬레이션 기간 (일자 단위 YYYY-MM-DD) ───────────────────────────────
simulation:
  start_date:    "2015-01-01"     # ★ 전체 시뮬레이션 시작 (warm-up 포함)
  end_date:      "2020-12-31"     # ★ 종료
  warm_up_years: 3                # 출력 제외 워밍업 (start_date 이후 N년)
  time_step:    "daily"           # daily | monthly


# ── 4. 보정 (Calibration) ───────────────────────────────────────────────────
calibration:
  # 4.1 보정·검증 기간 (시뮬레이션 기간의 부분집합)
  period:
    start: "2017-01-01"           # ★
    end:   "2018-12-31"           # ★
  validation:
    start: "2019-01-01"           # ★
    end:   "2020-12-31"           # ★

  # 4.2 ★ 관측점 × 변수 (flat list — 각 항목 독립)
  #     관측 자료 폴더 구조 (자동 산출, 사용자 수정 가능):
  #       $(input.observed)/{variable}/{time_step}/{outlet_name}.csv
  #       예: 0_database/obs/flow/daily/Rarotonga_Outlet.csv
  #
  #     허용 unit (단위 자동 변환은 swat_py.units 모듈):
  #       flow : m3/s (기본) | mm/day (depth) | l/s | m3/day
  #       ss   : t/day (기본) | mg/L
  #       tn   : kg/day (기본) | mg/L | t/day
  #       tp   : kg/day (기본) | mg/L | t/day
  #
  #     컬럼명 컨벤션 (자동): {variable}_{unit_suffix}
  #       flow_m3s, flow_mm, ss_mgl, ss_td, tn_mgl, tn_kgd, tp_mgl, tp_kgd
  #
  #     obs_file / obs_column 명시 시 자동 산출보다 우선.
  observations:
    - id:        "outlet1_flow"
      outlet_id: 1                        # ★ SWAT 채널 GIS ID (channel_sd_day.txt gis_id)
      variable:  "flow"
      unit:      "m3/s"
      time_step: "daily"
      weight:    1.0                      # 다중 변수 결합 시 가중치
      objective: "NSE"                    # NSE | KGE | R2 | PBIAS | RMSE
      # obs_file / obs_column 자동 산출 (생략 가능)
      # outlet_name 미명시 시 "outlet_{outlet_id}" 자동

    # 같은 outlet 에 다른 변수 추가
    # - id:        "outlet1_tn"
    #   outlet_id: 1
    #   variable:  "tn"
    #   unit:      "mg/L"
    #   time_step: "monthly"
    #   weight:    0.3
    #   objective: "PBIAS"

    # 다른 outlet 추가
    # - id:        "outlet2_flow"
    #   outlet_id: 5
    #   variable:  "flow"
    #   unit:      "mm/day"
    #   time_step: "daily"

    # 비표준 파일을 명시적으로 사용하려면:
    # - id:         "legacy_flow"
    #   outlet_id:  1
    #   variable:   "flow"
    #   unit:       "m3/s"
    #   time_step:  "daily"
    #   obs_file:   "/custom/legacy_obs.csv"
    #   obs_column: "Q_cms"

  # 4.3 보정 인자 (자동 보정 알고리즘이 사용할 인자·범위·변환 방식)
  #     change_type:
  #       absval  — 절대값으로 설정 (range 가 인자 자체의 범위)
  #       relchg  — 기존값 × (1 + r), r ∈ range
  #       abschg  — 기존값 + r, r ∈ range
  parameters:
    - file:        "hydrology.hyd"
      key:         "cn3_swf"
      range:       [0.5, 1.0]
      change_type: "absval"
    - file:        "soils.sol"
      key:         "sol_awc"
      range:       [-0.04, 0.04]
      change_type: "abschg"
    - file:        "basin.bsn"
      key:         "surlag"
      range:       [0.5, 10.0]
      change_type: "absval"

  # 4.4 보정 알고리즘
  method:
    name:         "manual"        # manual | sufi2 | pso | de | sce-ua
    n_iterations: 100
    seed:         1
    parallel:
      enabled:   true
      n_workers: 8

  # 4.5 결과 관리
  output:
    save_all_runs:           false   # 모든 시도 결과 보존
    save_best_n:             5        # 상위 N개만 보존
    auto_parameter_changes:  true     # default vs calibrated 자동 비교 CSV


# ── 5. 관측소 ────────────────────────────────────────────────────────────────
stations:
  metadata_file: "stations.csv"     # ★
  ids: []                            # ★ 사용할 관측소 ID 목록


# ── 7. 기후변화 시나리오 (선택) ─────────────────────────────────────────────
climate_change:
  enabled: false


# ── 8. 앙상블 확률예보 (선택, acidwg_py 연계) ──────────────────────────────
ensemble_forecast:
  enabled: false


# ── 9. 단일 계절 예보 (선택) ────────────────────────────────────────────────
seasonal_forecast:
  enabled: false
