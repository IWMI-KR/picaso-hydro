# swat_py configuration file
# Mirrors rSWAT.yaml — supports $(key) cross-references between values

# ── Project directories ──────────────────────────────────────────────────────
PrjDir: "C:/Projects/MyWatershed"
DbDir: "$(PrjDir)/Database"
CcDataDir: "$(DbDir)/ClimateChange"
FcstDataDir: "$(DbDir)/Forecast"
ObsDayDir: "$(DbDir)/Observed"
SmplDir: "$(DbDir)/Sample"
SwatRunDir: "$(PrjDir)/swat_run/TxtInOut"
SwatObsDir: "$(PrjDir)/swat_obs"
SwatCcDir: "$(PrjDir)/swat_cc"
SwatFcstDir: "$(PrjDir)/swat_fcst"
SwatDbDir: "$(DbDir)/SwatOutput"

# ── Simulation control ────────────────────────────────────────────────────────
CioNYSKIP: 3          # warm-up years to skip in output

# ── SWAT-Plus output types ────────────────────────────────────────────────────
# "sd" → channel_sd_day.txt; "wb" → basin_wb_day.txt
OutputTypes:
  - sd

# ── Weather stations ──────────────────────────────────────────────────────────
# CSV with columns: ID, Lat, Lon, Elev
StnFile: "stations.csv"
StnIDs:
  - asos203
  - asos232

# ── Monitoring outlets ────────────────────────────────────────────────────────
# NOTE: 구 OutletFlow*/OutletWq* 키는 제거됨. outlet↔채널 매핑은 이제 중첩(nested)
#       포맷의 calibration.observations[] 에서만 지정한다(swat_py.yaml 참조).
#       이 레거시 flat 포맷은 관측점 매핑을 지원하지 않으므로 분석 기능은 제한적이다.

# ── Observed data files (relative to SwatDbDir) ───────────────────────────────
# Flow CSV columns: year, mon, day, inflow_cms
ObsFlowFile: "obs_flow.csv"
# WQ CSV columns: date, ss_mgl, tn_mgl, tp_mgl
ObsWqFile: "obs_wq.csv"

# ── Climate change settings ───────────────────────────────────────────────────
CChangeOpt: "on"   # "on" or "off"

MdlNms:
  - CanESM5
  - ACCESS-CM2
  - INM-CM4-8
  - UKESM1-0-LL
  - MPI-ESM1-2-HR
  - MRI-ESM2-0

ScnNms:
  - historical
  - ssp126
  - ssp245
  - ssp370
  - ssp585

Syear_hist: 1981
Eyear_hist: 2010

Syear_rcp:
  - 2011
  - 2041
  - 2071
Eyear_rcp:
  - 2040
  - 2070
  - 2100

# ── Seasonal forecast settings ────────────────────────────────────────────────
SForecastOpt: "off"  # "on" or "off"
fiyearmode: false
Syear_Fcst: 2024
Eyear_Fcst: 2024
