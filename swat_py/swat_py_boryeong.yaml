# ══════════════════════════════════════════════════════════════════════════════
#  swat_py 설정 파일 — 보령댐 유역 테스트 케이스 (Boryeong Watershed)
#  원본 rSWAT.yaml 기반, swat_py 신규 형식으로 변환
# ══════════════════════════════════════════════════════════════════════════════
#
#  데이터 현황
#  -----------
#  유역   : 보령댐 유역 (충남 보령시 / Boryeong Dam Watershed)
#  관측소 : asos235 (보령), Lat 36.327°N, Lon 126.557°E, Elev 10 m
#  유량지점: Reach 1 (하류 출구점 "wl")
#  수질지점: Reach 1 ("wq")
#  모델   : SWAT 2012 (SWAT2020.exe, Rev 681)
#  출력   : output.rch (monthly, daily 선택 가능)
#
#  이미 수행된 R(rSWAT) 결과물
#  ----------------------------
#  swat_sim/rSWAT/Observed/Output/
#    output-Calibration.rch   : 2017-2018 보정 기간
#    output-Validation.rch    : 2021-2022 검증 기간
#    output-observed.rch      : 1998-2022 역사 기간
#  swat_sim/rSWAT/Observed/Analysis/
#    Calibration_flow_1-wl-daily.csv   (date, sim, obs)
#    Calibration_flow_1-wl-monthly.csv (yearmon, obs, sim)
#    Validation_flow_1-wl-daily.csv
#    observed_flow_1-wl-daily.csv
#  swat_sim/rSWAT/CChange/
#    Analysis/{모델명}/output_{시나리오}_1-wl_flow-daily.csv
#    Summary/Monthly-Mean-clim_1-wl_flow_historical_1981.csv
#    Summary/Monthly-Max-clim_...csv
#    Summary/Tenday-Mean-clim_...csv
#    Summary/Tenday-Max-clim_...csv
# ══════════════════════════════════════════════════════════════════════════════


# ── 1. 프로젝트 디렉토리 ─────────────────────────────────────────────────────
project:
  root:     "I:/2025-APCC_Cook/rSWAT/swat_sim/rSWAT"   # SWAT 실행 기준 폴더
  database: "I:/2025-APCC_Cook/rSWAT/Database"          # 공용 입력자료 DB

  input:
    observed_weather:  "$(project.database)/Observed"    # 기상 관측 CSV 폴더
    cc_weather:        "I:/_operational/SQM-KOR/kor_88stns/Downscale/SQM"  # 기후변화 기상 자료
    forecast_weather:  "$(project.root)/Forecast"        # (미사용)

  output:
    swat_run:       "$(project.root)/TxtInOut"           # SWAT 입출력 파일
    calibration:    "$(project.root)/Observed"           # 보정·검증 결과 저장
    climate_change: "$(project.root)/CChange"            # 기후변화 분석 결과
    forecast:       "$(project.root)/SForecast"          # 예보 결과 (미사용)
    database:       "$(project.database)/SWAT"           # 관측 자료 DB


# ── 2. 모델 설정 ─────────────────────────────────────────────────────────────
model:
  type:       "swat2012"       # SWAT 2012 모델 (output.rch 형식)
  executable: "SWAT2020.exe"   # 실행 파일명 (TxtInOut 폴더 내 위치)
  warm_up_years: 0             # 워밍업 없음 (CioNYSKIP = 0)

  # 분석에 사용할 출력 파일 종류
  #   rch : output.rch (하천 유량·수질)
  #   sub : output.sub (소유역 물수지)
  output_types:
    - rch


# ── 3. 기상 관측소 설정 ──────────────────────────────────────────────────────
#  메타정보 CSV (project.input.observed_weather 기준):
#    Lon,Lat,Elev,ID,Ename,SYear
#    126.55744,36.32724,10,asos235,Boryeong,1972
# ─────────────────────────────────────────────────────────────────────────────
stations:
  metadata_file: "Station-Infos.csv"   # project.input.observed_weather 폴더 내
  ids:
    - asos235


# ── 4. 모니터링 지점 설정 ────────────────────────────────────────────────────
outlets:
  flow:
    ids:   [1]      # output.rch 의 RCH 번호 (= GIS reach ID)
    names: [wl]     # 지점명 (파일명·그래프에 사용)

  water_quality:
    ids:   [1]
    names: [wq]


# ── 5. 관측 자료 ─────────────────────────────────────────────────────────────
#  파일 위치: project.output.database 폴더 기준
# ─────────────────────────────────────────────────────────────────────────────
observed:
  flow:
    # 필수 열: year(정수), mon(정수), day(정수), inflow_cms(실수)
    file: "flow-obs_test.csv"

  water_quality:
    # 필수 열: date(YYYY-MM-DD), ss_mgl, tn_mgl, tp_mgl
    file: "StreamWQ-Ansungcheon1-daily.csv"


# ── 6. 시뮬레이션 기간 및 분석 변수 ─────────────────────────────────────────
simulation:
  # 분석 변수 목록
  #   flow : 유량 (cms)        — 수위·유량 관측소
  #   sedc : 부유사 농도 (mg/L)
  #   tnc  : 총질소 농도 (mg/L)
  #   tpc  : 총인 농도 (mg/L)
  output_types:
    - flow
    # - sedc   # 수질 분석 시 주석 해제
    # - tnc
    # - tpc

  # 보정 기간 (2017-2018)
  calibration:
    start_year: 2017
    end_year:   2018

  # 검증 기간 (2021-2022)
  validation:
    start_year: 2021
    end_year:   2022

  # 역사 기준 기간 (long-term observed)
  baseline:
    start_year: 1998
    end_year:   2022


# ── 7. 기후변화 시나리오 분석 ────────────────────────────────────────────────
#  기상 자료 폴더 구조 (cc_weather 기준):
#    {cc_weather}/{모델명}/{asos235}_{시나리오}_*.csv
# ─────────────────────────────────────────────────────────────────────────────
climate_change:
  enabled: true

  # CMIP6 GCM 18개 모델
  models:
    - CanESM5
    - ACCESS-CM2
    - INM-CM4-8
    - UKESM1-0-LL
    - MPI-ESM1-2-HR
    - IPSL-CM6A-LR
    - ACCESS-ESM1-5
    - CNRM-CM6-1
    - CNRM-ESM2-1
    - GFDL-ESM4
    - INM-CM5-0
    - MIROC6
    - MIROC-ES2L
    - MPI-ESM1-2-LR
    - NorESM2-LM
    - KACE-1-0-G
    - MRI-ESM2-0
    - EC-Earth3

  scenarios:
    - historical
    - ssp126
    - ssp245
    - ssp370
    - ssp585

  historical_period:
    start_year: 1981
    end_year:   2010

  future_periods:
    - start_year: 2011
      end_year:   2040
      label:      "near_future"
    - start_year: 2041
      end_year:   2070
      label:      "mid_future"
    - start_year: 2071
      end_year:   2100
      label:      "far_future"


# ── 8. 앙상블 확률예보 ───────────────────────────────────────────────────────
ensemble_forecast:
  enabled: false    # acidwg_py 자료 확보 후 활성화


# ── 9. 계절 예보 ─────────────────────────────────────────────────────────────
seasonal_forecast:
  enabled: false
