[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picaso_hydro"
version = "0.1.0"
description = "PICASO-Hydro 프로젝트 초기화 — 고정 폴더 구조 + 샘플 config 스캐폴딩"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "IWMI-KR"}
]
keywords = ["PICASO-Hydro", "SWAT", "hydrology", "project-scaffold", "initializer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
]
# 런타임 의존성 없음 — 순수 stdlib(폴더 생성 + 번들 템플릿 복사).

[project.scripts]
picaso-hydro-init = "picaso_hydro.init:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
picaso_hydro = ["py.typed", "templates/config/*.yaml", "templates/*.csv"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
