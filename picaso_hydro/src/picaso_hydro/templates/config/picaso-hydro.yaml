# ══════════════════════════════════════════════════════════════════════════════
#  picaso-hydro.yaml — acidwg·swat 서브패키지 **공통** 변수 (SSOT)
#
#  두 로더(swat_py.config / acidwg_py.config)가 각자 config 폴더의 이 파일을 자동
#  병합해, 아래 공통값을 자기 설정 구조로 주입한다. 예측연월·앙상블 수·warm-up 등을
#  여기서만 바꾸면 상세화(acidwg)·모델링(swat)·대시보드가 동일 값으로 일관 실행된다.
#
#  구성: swat_py.yaml = swat 전용 · acidwg_py.yaml = acidwg 전용 · 이 파일 = 공통.
# ══════════════════════════════════════════════════════════════════════════════

# ── 프로젝트 (공통 루트·DB·관측기상) ─────────────────────────────────────────
project:
  root:     "${env:PICASO_ROOT:__PROJECT_ROOT__}"   # 환경변수 PICASO_ROOT 우선, 없으면 초기화 경로
  database: "$(project.root)/0_database"
  obs_weather_std: "$(project.database)/obs/weather"              # 표준 daily_std 관측

# ── 예측 대상 (공통) ─────────────────────────────────────────────────────────
forecast:
  period: "2016_AMJ"           # 예측연월 {year}_{season}

# ── 앙상블 (공통) ────────────────────────────────────────────────────────────
ensemble:
  n_members: 100               # 상세화(acidwg)·모델링(swat) 공통 앙상블 수

# ── 시뮬레이션 (공통) ────────────────────────────────────────────────────────
simulation:
  warm_up_years: 3             # 모델 warm-up (= 출력 시작 오프셋)
