# ══════════════════════════════════════════════════════════════════════════════
#  acidwg_py 설정 파일 — APCC 계절예측 통계적 상세화
#  (R rACID 패키지의 Python 포팅)
# ══════════════════════════════════════════════════════════════════════════════
#
#  [ 참조 문법 ]
#    $(섹션.키)             — 같은 YAML 안의 다른 값을 참조
#    ${env:VAR}             — 환경변수 사용
#    ${env:VAR:default}     — 환경변수 + 기본값
#
#  [ 자동 탐색 ]
#    환경변수 ACIDWG_PY_CONFIG 또는 cwd 위로 acidwg_py.yaml 검색.
#
#  [ 실행 모드 ]
#    operational : 단일 (year × season) — acidwg-run         (기본)
#    hindcast    : 다년 × 다계절 일괄  — acidwg-run --hindcast
# ══════════════════════════════════════════════════════════════════════════════


# ── 1. 경로 (operational/hindcast 공용) ──────────────────────────────────────
paths:
  base_dir:    "${env:PICASO_ROOT:I:/2025-APCC_Cook/PICASO-Hydro}"
  station_csv: "$(paths.base_dir)/1_acidwg/config/stations.csv"
  obs_dir:     "$(paths.base_dir)/0_database/obs/weather/daily_std"  # util_py 표준 daily 포맷
  picaso_dir:  "$(paths.base_dir)/1_acidwg/picaso"                    # forecast CSV 폴더
  output_root: "$(paths.base_dir)/1_acidwg"                           # operational/, hindcast/ 부모
  model_file:  "$(paths.base_dir)/1_acidwg/cache/acidwg_model.pkl"    # 모델 캐시 (operational only)


# ── 2. 관측 기간 (모델 적합용 기본 범위) ─────────────────────────────────────
observation:
  syear: 1981
  eyear: 2010


# ── 3. operational 모드 — 단일 연도 × 계절 (acidwg-run) ─────────────────────
operational:
  year:   2024
  season: "JFM"      # 12개 계절 코드 (JFM, FMA, ..., DJF)
  # 또는 직접 월 목록:
  # months: [1, 2, 3]


# ── 4. hindcast 모드 — 다년 × 다계절 일괄 (acidwg-run --hindcast) ───────────
hindcast:
  years:   [1991, 2020]   # [start, end] 연속 범위 — 또는 명시 리스트 [1991, 1995, 2010]
  seasons: "all"           # "all" 또는 ["JFM", "FMA", ...]
  observation_eyear_cap: true   # 각 hindcast 연도 직전까지로 관측 자동 제한 (leakage 방지)


# ── 5. 앙상블 (공용) ─────────────────────────────────────────────────────────
ensemble:
  n_members:   1000
  random_seed: 1     # null이면 매번 다른 시나리오


# ── 6. 모델 (공용) ───────────────────────────────────────────────────────────
model:
  retrieve: true     # operational: model_file 캐시 / hindcast cap=true: 자동 false


# ── 7. 출력 (공용) ───────────────────────────────────────────────────────────
output:
  overwrite: false
  variables:
    - prcp
    - tmax
    - tmin


# ── 8. 고급 (optional) ───────────────────────────────────────────────────────
advanced:
  max_retry_factor: 5
  n_cores:          1
  validate_after:   false
