# ══════════════════════════════════════════════════════════════════════════════
#  acidwg_py 설정 파일 — APCC 계절예측 통계적 상세화
#  (R rACID 패키지의 Python 포팅)
# ══════════════════════════════════════════════════════════════════════════════
#
#  [ 참조 문법 ]
#    $(섹션.키)             — 같은 YAML 안의 다른 값을 참조
#    ${env:VAR}             — 환경변수 사용
#    ${env:VAR:default}     — 환경변수 + 기본값
#
#  [ 자동 탐색 ]
#    환경변수 ACIDWG_PY_CONFIG 또는 cwd 위로 acidwg_py.yaml 검색.
# ══════════════════════════════════════════════════════════════════════════════


# ── 1. 경로 ──────────────────────────────────────────────────────────────────
paths:
  base_dir:     "${env:PICASO_ROOT:I:/2025-APCC_Cook/PICASO-Hydro}"
  station_csv:  "$(paths.base_dir)/1_acidwg/config/stations.csv"
  forecast_csv: "$(paths.base_dir)/1_acidwg/picaso/2024_JFM_picaso.csv"  # 예보 입력 CSV
  obs_dir:      "$(paths.base_dir)/0_database/obs/weather"               # 관측소별 일자료 폴더
  output_dir:   "$(paths.base_dir)/1_acidwg/operational/2024/JFM"        # 시나리오 출력
  model_file:   "$(paths.base_dir)/1_acidwg/cache/acidwg_model.pkl"      # 적합 모델 캐시 (생략 가능)


# ── 2. 관측 기간 ─────────────────────────────────────────────────────────────
observation:
  syear: 1981
  eyear: 2010


# ── 3. 예보 대상 ─────────────────────────────────────────────────────────────
forecast:
  year:   2024
  season: "JFM"      # 12개 계절 코드 중 하나 (JFM, FMA, ..., DJF)
  # 또는 직접 월 목록을 지정하면 season 무시:
  # months: [1, 2, 3]


# ── 4. 앙상블 ────────────────────────────────────────────────────────────────
ensemble:
  n_members:   1000
  random_seed: 1     # null이면 매번 다른 시나리오


# ── 5. 모델 ──────────────────────────────────────────────────────────────────
model:
  retrieve: true     # true이면 model_file 캐시 사용 (있으면 로드, 없으면 적합 후 저장)


# ── 6. 출력 ──────────────────────────────────────────────────────────────────
output:
  overwrite: false
  variables:
    - prcp
    - tmax
    - tmin


# ── 7. 고급 (optional) ───────────────────────────────────────────────────────
advanced:
  max_retry_factor: 5
  n_cores:          1
  validate_after:   false
