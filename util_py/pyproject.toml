[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "util_py"
version = "0.1.0"
description = "PICASO-Hydro utilities — ERA5 download/extract, CMIP6 regional subset"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "IWMI-KR"}
]
keywords = ["ERA5", "CMIP6", "CDS API", "netCDF", "hydrology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "cdsapi>=0.7.0",
    "netCDF4>=1.6.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.4",
    "ruff>=0.1",
]

[project.scripts]
util-download-national = "util_py.cli.download_national:main"
util-era5-update = "util_py.cli.era5_update:main"
util-era5-download = "util_py.cli.era5_download:main"
util-era5-extract  = "util_py.cli.era5_extract:main"
util-gsod-download = "util_py.cli.gsod_download:main"
util-gis-download  = "util_py.cli.gis_download:main"
util-gis-clip-to-user = "util_py.cli.gis_clip_to_user:main"
util-streamflow-download = "util_py.cli.streamflow_download:main"
util-weather-standardize = "util_py.cli.weather_standardize:main"
util-weather-validate    = "util_py.cli.weather_validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
util_py = ["py.typed", "templates/*.yaml", "templates/weather_mapping/*.yaml", "templates/weather_mapping/*.md"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
