# ══════════════════════════════════════════════════════════════════════════════
#  kma.yaml — 한국 기상청(KMA) ASOS 일자료 매핑
#
#  KMA ASOS 일자료 (kma.go.kr / data.kma.go.kr) 표준 컬럼:
#    지점, 일시, 기온평균(°C), 기온최저(°C), 기온최고(°C),
#    강수량(mm), 평균풍속(m/s), 평균상대습도(%), 합계일사(MJ/m²),
#    이슬점온도평균(°C), 평균증기압(hPa), ...
# ══════════════════════════════════════════════════════════════════════════════

resolution: daily

columns:
  date:    "일시"
  pcp_mm:  "강수량(mm)"
  tmax_c:  "기온최고(°C)"
  tmin_c:  "기온최저(°C)"
  tavg_c:  "기온평균(°C)"
  tdew_c:  "이슬점온도평균(°C)"
  hmd_pct: "평균상대습도(%)"      # 직접 제공
  ws10_ms: "평균풍속(m/s)"        # KMA 표준 측정 고도 10 m
  slr_mjm2: "합계일사(MJ/m²)"

units:
  pcp:   mm
  temp:  C
  wind:  ms

wind_height_m: 10.0
date_format:   "%Y-%m-%d"
missing_value: null              # KMA 결측: 빈 셀 (NaN 자동 인식)
